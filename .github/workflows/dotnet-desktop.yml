name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix: 
        os: 
          - name: ubuntu-latest
            rid: linux-x64
            pkgRid: linux.x64
          - name: windows-latest
            rid: win-x64
            pkgRid: win.x64
    runs-on: ${{ matrix.os.name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      if: contains(github.ref, 'master')
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: "5.x"

    - name: Determine Version
      if: contains(github.ref, 'master')
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: dotnet publish
      run: |
        dotnet publish DXHRDCHudScaler/DXHRDCHudScaler.csproj -c Release -o bin -r ${{ matrix.os.rid }} -p:Version=${{ steps.gitversion.outputs.SemVer }} -p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemFileVer }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.3.6
      with:
        name: DXHRDC-HudScaler.${{ steps.gitversion.outputs.semVer }}+${{ matrix.os.pkgRid }}
        path: bin
